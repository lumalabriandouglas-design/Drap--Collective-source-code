<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="6EHqUT7200YHh02sinjadvrn2L1oJd9_yVS1ube8yxI" />
    <title>Drapé Collective</title>
    <meta
      name="description"
      content="A private marketplace connecting independent fashion designers with discerning collectors. Discover unique, handcrafted fashion."
    />
    <meta name="theme-color" content="#F6F1EA" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    />
    <script>
      try {
        if (localStorage.getItem("drape.theme") === "charcoal") {
          document.documentElement.setAttribute("data-theme", "charcoal");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
  </head>
  <body class="min-h-dvh bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
